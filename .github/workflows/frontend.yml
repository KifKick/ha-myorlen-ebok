name: Frontend

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck, test and build
        run: npm run verify
      # HACS installs the repository as it is, so the bundle must be committed and current.
      - name: The committed card bundle is up to date
        run: git diff --exit-code -- ../custom_components/myorlen_ebok/frontend/
